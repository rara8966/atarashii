server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    connection-timeout: 300000
    keep-alive-timeout: 310000

spring:
  # 构建期由 Maven 填充：默认构建=default（服务器/本地，判定引擎在本机）；
  # mvn -Pclient 构建=client（客户端，判定走云端 RemoteZoneVerdictService）。
  profiles:
    active: '@activatedProfile@'
  config:
    import: optional:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/atarashii?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectionCollation=utf8mb4_unicode_ci
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:atarashii}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 320MB

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-ms: 2592000000
  license:
    # 本地/老演示模式保持 false（不校验授权）；服务器生产环境用环境变量 LICENSE_ENABLED=true 打开。
    enabled: ${LICENSE_ENABLED:false}
    # 管理员令牌，签发/吊销授权用；留空则管理接口一律拒绝。生产环境必须用环境变量注入。
    admin-token: ${LICENSE_ADMIN_TOKEN:}
  policy-card-path: ../../2025重大项目用地政策明白卡.pdf
  template-policy-path: ../../自然资源部办公厅关于进一步规范建设用地报批文本格式的函（自然资办函〔2024〕1009号）.pdf
  ollama-base-url: http://localhost:11434
  ollama-model: qwen25vl-7b-local:latest
  ollama-fallback-model: qwen25vl-3b-local:latest
  ollama-enabled: true
  ollama-timeout-seconds: 120
  ai-full-text-chunk-size: 12000
  ai-full-text-max-chunks: 80
  ocr-enabled: true
  ocr-engine: auto
  ocr-max-pages: 120
  ocr-dpi: 160
  ocr-min-useful-chars: 1500
  ocr-tesseract-command: C:/Program Files/Tesseract-OCR/tesseract.exe
  ocr-tesseract-language: chi_sim+eng
  ocr-tesseract-data-path:
  ocr-tesseract-page-seg-mode: 6
  ocr-tesseract-timeout-seconds: 90

  # 客户端构建（client profile）连云配置。服务器/本地构建不读这一段。
  # 真实值由客户端的 application-local.yml 或环境变量注入，不要写死在仓库里。
  cloud-client:
    base-url: ${CLOUD_BASE_URL:}
    license-key: ${CLOUD_LICENSE_KEY:}
    machine-id: ${CLOUD_MACHINE_ID:}
    timeout-seconds: 30
